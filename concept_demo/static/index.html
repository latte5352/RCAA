<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codebeamer CM Manager (컨셉 데모)</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #dde2e7;
    --text: #1f2933;
    --sub: #64748b;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --ok: #16a34a;
    --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--sub);
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--sub);
    margin: 14px 0 6px;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 11px 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #a8b3c1; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--sub);
    border: 1px solid var(--border);
    font-weight: 500;
  }
  button.secondary:hover { background: #f1f5f9; }
  .msg {
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.5;
  }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .hidden { display: none !important; }
  .welcome {
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 18px;
  }
  .welcome b { color: var(--text); }
  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
  }
  .step {
    flex: 1;
    text-align: center;
    font-size: 11px;
    padding: 6px 4px;
    border-radius: 6px;
    background: #eef2f7;
    color: var(--sub);
  }
  .step.active {
    background: #dbeafe;
    color: var(--accent);
    font-weight: 600;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top-row">
      <h1>Codebeamer CM Manager</h1>
      <span style="font-size:11px;color:var(--sub);">컨셉 데모</span>
    </div>
    <p class="subtitle">주기적 형상 감사 자동화 — 로그인 · 프로젝트 선택 (v0)</p>

    <div class="steps">
      <div class="step" id="step1">1. 로그인</div>
      <div class="step" id="step2">2. 프로젝트 선택</div>
      <div class="step" id="step3">3. 형상 감사</div>
    </div>

    <!-- 로그인 화면 -->
    <div id="loginView">
      <label for="username">코드비머 아이디</label>
      <input id="username" type="text" autocomplete="username" placeholder="예: noah.myeong" />

      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="코드비머 비밀번호" />

      <button id="loginBtn">로그인</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- 로그인 이후 화면 -->
    <div id="mainView" class="hidden">
      <div class="welcome"><b id="welcomeUser"></b> 님, 환영합니다. 할당된 프로젝트를 불러왔습니다.</div>

      <label for="projectSelect">프로젝트 선택</label>
      <select id="projectSelect"></select>

      <button id="auditBtn">주기적 형상 감사 시작</button>
      <div id="auditMsg" class="msg"></div>

      <button id="logoutBtn" class="secondary" style="margin-top:10px;">로그아웃</button>
    </div>
  </div>

<script>
const loginView = document.getElementById('loginView');
const mainView = document.getElementById('mainView');
const loginBtn = document.getElementById('loginBtn');
const loginMsg = document.getElementById('loginMsg');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const welcomeUser = document.getElementById('welcomeUser');
const projectSelect = document.getElementById('projectSelect');
const auditBtn = document.getElementById('auditBtn');
const auditMsg = document.getElementById('auditMsg');
const logoutBtn = document.getElementById('logoutBtn');
const step1 = document.getElementById('step1');
const step2 = document.getElementById('step2');
const step3 = document.getElementById('step3');

function setStep(n) {
  [step1, step2, step3].forEach((el, i) => el.classList.toggle('active', i === n - 1));
}

async function login() {
  loginMsg.textContent = '';
  loginMsg.className = 'msg';
  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  if (!username || !password) {
    loginMsg.textContent = '아이디/비밀번호를 입력해주세요.';
    loginMsg.className = 'msg err';
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = '로그인 확인 중...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (data.ok) {
      welcomeUser.textContent = data.username;
      loginView.classList.add('hidden');
      mainView.classList.remove('hidden');
      setStep(2);
      await loadProjects();
    } else {
      loginMsg.textContent = data.error || '로그인에 실패했습니다.';
      loginMsg.className = 'msg err';
    }
  } catch (e) {
    loginMsg.textContent = '요청 중 오류가 발생했습니다: ' + e;
    loginMsg.className = 'msg err';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = '로그인';
  }
}

async function loadProjects() {
  projectSelect.innerHTML = '<option>불러오는 중...</option>';
  try {
    const res = await fetch('/api/projects');
    const data = await res.json();
    if (data.ok) {
      if (data.projects.length === 0) {
        projectSelect.innerHTML = '<option>할당된 프로젝트가 없습니다</option>';
        return;
      }
      projectSelect.innerHTML = data.projects
        .map(p => `<option value="${p.name}">${p.name}</option>`)
        .join('');
    } else {
      projectSelect.innerHTML = '<option>조회 실패</option>';
      auditMsg.textContent = data.error || '프로젝트 목록을 불러오지 못했습니다.';
      auditMsg.className = 'msg err';
    }
  } catch (e) {
    projectSelect.innerHTML = '<option>조회 실패</option>';
    auditMsg.textContent = '요청 중 오류가 발생했습니다: ' + e;
    auditMsg.className = 'msg err';
  }
}

async function startAudit() {
  auditMsg.textContent = '';
  auditMsg.className = 'msg';
  const projectName = projectSelect.value;
  auditBtn.disabled = true;
  setStep(3);

  try {
    const res = await fetch('/api/start-audit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_name: projectName })
    });
    const data = await res.json();
    auditMsg.textContent = data.message || '요청이 완료되었습니다.';
    auditMsg.className = 'msg ok';
  } catch (e) {
    auditMsg.textContent = '요청 중 오류가 발생했습니다: ' + e;
    auditMsg.className = 'msg err';
  } finally {
    auditBtn.disabled = false;
  }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  mainView.classList.add('hidden');
  loginView.classList.remove('hidden');
  passwordInput.value = '';
  loginMsg.textContent = '';
  auditMsg.textContent = '';
  setStep(1);
}

loginBtn.addEventListener('click', login);
auditBtn.addEventListener('click', startAudit);
logoutBtn.addEventListener('click', logout);
passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

setStep(1);
</script>
</body>
</html>
