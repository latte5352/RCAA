<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SUP.8 형상감사 자동화</title>
<style>
  body { width: 100%; max-width: 380px; margin: 0 auto; box-sizing: border-box; font-family: sans-serif; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  input, select { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px; }
  button { width: 100%; padding: 8px; cursor: pointer; }
  .hidden { display: none; }
  #error { color: #c0392b; font-size: 12px; margin-top: 6px; }
  #progressWrap { margin-top: 10px; }
  #progressBar { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
  #progressFill { height: 100%; width: 0%; background: #2d6cdf; transition: width .3s; }
  #step { font-size: 12px; margin-top: 6px; color: #555; }
  #downloadLink { display: block; text-align: center; margin-top: 8px; padding: 8px; background: #2d6cdf; color: #fff; border-radius: 4px; text-decoration: none; }
  #logoutBtn { margin-top: 10px; background: none; border: none; color: #888; font-size: 11px; text-decoration: underline; }
  #reviewNotice { font-size: 12px; margin-top: 8px; padding: 8px; background: #fff8e1; border: 1px solid #f0c14b; border-radius: 4px; }
  #reviewActions { display: flex; gap: 6px; margin-top: 8px; }
  #approveBtn { background: #c0392b; color: #fff; border: none; border-radius: 4px; }
  #rejectBtn { background: #eee; border: none; border-radius: 4px; }
  #selectActions { display: flex; gap: 6px; margin-top: 8px; }
  #selectActions button { font-size: 11px; padding: 4px; background: #eee; border: none; border-radius: 4px; }
  #itemsList { max-height: 320px; overflow-y: auto; margin-top: 6px; border: 1px solid #ddd; border-radius: 4px; }
  .item-row { display: flex; align-items: flex-start; gap: 6px; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 12px; }
  .item-row:last-child { border-bottom: none; }
  .item-row input { width: auto; margin: 2px 0 0; }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; word-break: break-all; }
  .item-badges { display: flex; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; }
  .badge.ok { background: #e3f5e6; color: #1e7e34; }
  .badge.ng { background: #fbe4e2; color: #c0392b; }
  .item-comment { font-size: 11px; color: #777; margin-top: 2px; }
  #unregisteredWrap { margin-top: 10px; padding: 8px; background: #fdecea; border: 1px solid #e57373; border-radius: 4px; }
  #unregisteredTitle { font-size: 12px; font-weight: 600; color: #c0392b; margin-bottom: 4px; }
  #unregisteredList { font-size: 12px; max-height: 150px; overflow-y: auto; }
  #unregisteredList div { padding: 2px 0; }
  #newTrackersWrap { margin-top: 10px; padding: 8px; background: #e8f4fd; border: 1px solid #90caf9; border-radius: 4px; }
  #newTrackersTitle { font-size: 12px; font-weight: 600; color: #1565c0; margin-bottom: 4px; }
  #newTrackersList { font-size: 12px; max-height: 150px; overflow-y: auto; }
  #newTrackersList div { padding: 2px 0; }
  #changedTrackersWrap { margin-top: 10px; padding: 8px; background: #fff8e1; border: 1px solid #f0c14b; border-radius: 4px; }
  #changedTrackersTitle { font-size: 12px; font-weight: 600; color: #b8860b; margin-bottom: 4px; }
  #changedTrackersList { font-size: 12px; max-height: 180px; overflow-y: auto; }
  .change-row { padding: 4px 0; border-bottom: 1px solid #f0e0b0; }
  .change-row:last-child { border-bottom: none; }
  .change-name { font-weight: 600; }
  .change-detail { color: #666; }
  #versionFailWrap { margin-top: 10px; padding: 8px; background: #fdf0e6; border: 1px solid #e8a05a; border-radius: 4px; }
  #versionFailTitle { font-size: 12px; font-weight: 600; color: #a85c1a; margin-bottom: 4px; }
  #versionFailList { font-size: 12px; max-height: 150px; overflow-y: auto; }
  .version-fail-row { padding: 3px 0; }
  .version-fail-reason { color: #888; }
</style>
</head>
<body>
  <h1>SUP.8 형상감사 자동화</h1>

  <div id="loginView">
    <input id="username" type="text" placeholder="codebeamer 계정" autocomplete="username">
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="loginBtn">로그인</button>
    <div id="error"></div>
  </div>

  <div id="runView" class="hidden">
    <select id="projectSelect"></select>
    <select id="cadenceSelect">
      <option value="weekly">매주</option>
      <option value="biweekly" selected>2주</option>
      <option value="monthly">한달</option>
    </select>
    <select id="weekdaySelect">
      <option value="0">월요일</option>
      <option value="1">화요일</option>
      <option value="2">수요일</option>
      <option value="3">목요일</option>
      <option value="4">금요일</option>
      <option value="5">토요일</option>
      <option value="6">일요일</option>
    </select>
    <select id="dayOfMonthSelect" class="hidden"></select>
    <button id="runBtn">감사 실행</button>
    <div id="progressWrap" class="hidden">
      <div id="progressBar"><div id="progressFill"></div></div>
      <div id="step"></div>
      <a id="downloadLink" class="hidden" href="#" download>결과 파일 다운로드</a>
      <div id="reviewNotice" class="hidden">
        감사 규칙 검사까지 끝났습니다. codebeamer에는 아직 아무 것도 반영되지 않았습니다.
        아래 목록에서 반영하고 싶지 않은 항목은 체크 해제한 뒤 진행하세요.
      </div>
      <div id="selectActions" class="hidden">
        <button id="selectAllBtn" type="button">전체 선택</button>
        <button id="selectNoneBtn" type="button">전체 해제</button>
      </div>
      <div id="itemsList" class="hidden"></div>
      <div id="unregisteredWrap" class="hidden">
        <div id="unregisteredTitle">⚠ Item List 미등재 산출물</div>
        <div id="unregisteredList"></div>
      </div>
      <div id="newTrackersWrap" class="hidden">
        <div id="newTrackersTitle">🆕 지난 감사 대비 새로 등재된 산출물</div>
        <div id="newTrackersList"></div>
      </div>
      <div id="changedTrackersWrap" class="hidden">
        <div id="changedTrackersTitle">🔄 지난 감사 대비 상태/버전이 변경된 산출물</div>
        <div id="changedTrackersList"></div>
      </div>
      <div id="versionFailWrap" class="hidden">
        <div id="versionFailTitle">🔍 리뷰 대상 버전 자동 확인 불가 (직접 확인 필요)</div>
        <div id="versionFailList"></div>
      </div>
      <div id="reviewActions" class="hidden">
        <button id="approveBtn">선택 항목 반영</button>
        <button id="rejectBtn">전체 취소</button>
      </div>
    </div>
    <button id="logoutBtn">로그아웃</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
