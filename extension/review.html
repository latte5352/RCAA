<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>감사 결과 검토</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #f5f6f8; color: #222; font-size: 15px; }
  header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #ddd; padding: 14px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #subtitle { font-size: 13px; color: #666; }
  main { padding: 20px 24px 40px; max-width: 1200px; margin: 0 auto; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  #searchInput { flex: 1; min-width: 220px; padding: 9px 12px; font-size: 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { cursor: pointer; padding: 8px 14px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  button:hover { background: #f0f0f0; }
  #downloadBtn { text-decoration: none; color: #222; display: inline-block; }
  #applyBtn { background: #c0392b; border-color: #c0392b; color: #fff; font-weight: 600; }
  #applyBtn:hover { background: #a5311f; }
  #cancelBtn { color: #888; }
  #matchCount { font-size: 13px; color: #888; margin-left: auto; }
  section.warn { margin-bottom: 14px; padding: 14px 18px; border-radius: 4px; font-size: 14px; line-height: 1.6; }
  section.warn h2 { font-size: 14px; margin: 0 0 8px; }
  section.warn .row { padding: 4px 0; }
  #unregisteredWrap { background: #fdecea; border: 1px solid #e57373; color: #c0392b; }
  #newTrackersWrap { background: #e8f4fd; border: 1px solid #90caf9; color: #1565c0; }
  #changedTrackersWrap { background: #fff8e1; border: 1px solid #f0c14b; color: #b8860b; }
  #versionFailWrap { background: #fdf0e6; border: 1px solid #e8a05a; color: #a85c1a; }
  .change-detail, .version-fail-reason { color: #666; font-weight: normal; }
  #reviewNotice { font-size: 14px; line-height: 1.6; margin-bottom: 14px; padding: 12px 18px; background: #fff8e1; border: 1px solid #f0c14b; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
  thead th { text-align: left; font-size: 13px; font-weight: 700; color: #333; background: #eef1f5; padding: 10px 12px; border-bottom: 2px solid #ccd2da; }
  tbody td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.hidden { display: none; }
  tbody tr:hover { background: #fafcff; }
  .col-check { width: 28px; }
  .col-name { width: 26%; font-weight: 600; word-break: break-all; }
  .col-badges { width: 170px; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 7px; border-radius: 3px; margin: 1px; }
  .badge.ok { background: #e3f5e6; color: #1e7e34; }
  .badge.ng { background: #fbe4e2; color: #c0392b; }
  .col-comment { color: #444; }
  #status { font-size: 14px; margin-top: 14px; color: #555; }
  #loading, #empty { padding: 30px; text-align: center; color: #888; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>감사 결과 검토</h1>
    <div id="subtitle">codebeamer에는 아직 반영되지 않았습니다. 반영하지 않을 항목은 체크 해제한 뒤 진행하세요.</div>
  </header>
  <main>
    <div id="reviewNotice" class="hidden"></div>

    <div id="unregisteredWrap" class="warn hidden">
      <h2>⚠ Item List 미등재 산출물</h2>
      <div id="unregisteredList"></div>
    </div>
    <div id="newTrackersWrap" class="warn hidden">
      <h2>🆕 지난 감사 대비 새로 등재된 산출물</h2>
      <div id="newTrackersList"></div>
    </div>
    <div id="changedTrackersWrap" class="warn hidden">
      <h2>🔄 지난 감사 대비 상태/버전이 변경된 산출물</h2>
      <div id="changedTrackersList"></div>
    </div>
    <div id="versionFailWrap" class="warn hidden">
      <h2>🔍 리뷰 대상 버전 자동 확인 불가 (직접 확인 필요)</h2>
      <div id="versionFailList"></div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="산출물명 또는 코멘트로 검색...">
      <button id="selectAllBtn" type="button">전체 선택</button>
      <button id="selectNoneBtn" type="button">전체 해제</button>
      <a id="downloadBtn" href="#" download>결과 파일 다운로드</a>
      <span id="matchCount"></span>
    </div>

    <div id="loading">불러오는 중...</div>
    <div id="empty" class="hidden">검토할 항목이 없습니다.</div>
    <table id="itemsTable" class="hidden">
      <thead>
        <tr>
          <th class="col-check"></th>
          <th class="col-name">트래커명</th>
          <th class="col-badges">규칙 결과</th>
          <th class="col-comment">감사 코멘트</th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <div class="toolbar" id="actionsToolbar" style="margin-top: 16px;">
      <button id="applyBtn">선택 항목 반영</button>
      <button id="cancelBtn">전체 취소</button>
    </div>
    <div id="status"></div>
  </main>

  <script src="review.js"></script>
</body>
</html>
